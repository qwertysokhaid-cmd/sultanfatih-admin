# Setiap ada perubahan di branch main (termasuk dari panel /admin), website dibangun ulang
# lalu diunggah ke hosting berbayar lewat FTP. Hanya file yang berubah yang diunggah ulang.
# Rahasia yang perlu diisi di GitHub → Settings → Secrets and variables → Actions:
#   FTP_SERVER     contoh: ftp.sultanfatihtravel.com
#   FTP_USERNAME   akun FTP dari cPanel
#   FTP_PASSWORD   kata sandi akun FTP
#   FTP_SERVER_DIR (opsional) folder website di hosting, bawaan: public_html/
#   FTP_PROTOCOL   (opsional) ftps atau ftp, bawaan: ftps
name: Deploy ke hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Unggah ke hosting
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR || 'public_html/' }}
