<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#7e1cba" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Sultan Fatih Tour & Travel</title>
    <!-- Inline so the splash shows before the JS/CSS bundle arrives; React replaces #root's content on mount. -->
    <style>
      .splash { position: fixed; inset: 0; display: grid; place-items: center; background: #faf9fc; }
      .loader {
        width: 50px;
        aspect-ratio: 1;
        border-radius: 50%;
        background: #7e1cba;
        -webkit-mask: radial-gradient(circle closest-side at 50% 40%, #0000 94%, #000);
        mask: radial-gradient(circle closest-side at 50% 40%, #0000 94%, #000);
        transform-origin: 50% 40%;
        animation: l25 1s infinite linear;
      }
      @keyframes l25 { 100% { transform: rotate(1turn) } }
      @media (prefers-reduced-motion: reduce) { .loader { animation-duration: 3s } }
    </style>
  </head>
  <body>
    <div id="root"><div class="splash" role="status" aria-label="Memuat halaman"><div class="loader"></div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
